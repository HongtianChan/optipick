<svg xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="540" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="40" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#000000">
    Runtime vs Group Count (Representative Cases)
  </text>
  <text x="40" y="80" font-family="Arial, sans-serif" font-size="16" fill="#000000">
    Data source: presentation-benchmark-data.csv
  </text>

  <line x1="90" y1="430" x2="670" y2="430" stroke="#000000" stroke-width="2"/>
  <line x1="90" y1="140" x2="90" y2="430" stroke="#000000" stroke-width="2"/>
  <text x="25" y="145" font-family="Arial, sans-serif" font-size="14" fill="#000000">6000</text>
  <text x="25" y="220" font-family="Arial, sans-serif" font-size="14" fill="#000000">4500</text>
  <text x="25" y="295" font-family="Arial, sans-serif" font-size="14" fill="#000000">3000</text>
  <text x="25" y="370" font-family="Arial, sans-serif" font-size="14" fill="#000000">1500</text>
  <text x="35" y="435" font-family="Arial, sans-serif" font-size="14" fill="#000000">0</text>
  <text x="100" y="460" font-family="Arial, sans-serif" font-size="14" fill="#000000">Small</text>
  <text x="270" y="460" font-family="Arial, sans-serif" font-size="14" fill="#000000">Medium</text>
  <text x="455" y="460" font-family="Arial, sans-serif" font-size="14" fill="#000000">Large</text>
  <text x="620" y="460" font-family="Arial, sans-serif" font-size="14" fill="#000000">Case scale</text>
  <text x="95" y="120" font-family="Arial, sans-serif" font-size="14" fill="#000000">Runtime (ms)</text>

  <rect x="120" y="237" width="90" height="193" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="290" y="186" width="90" height="244" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="460" y="417" width="90" height="13" fill="#ffffff" stroke="#000000" stroke-width="2"/>

  <text x="120" y="230" font-family="Arial, sans-serif" font-size="13" fill="#000000">4002</text>
  <text x="290" y="179" font-family="Arial, sans-serif" font-size="13" fill="#000000">5046</text>
  <text x="460" y="410" font-family="Arial, sans-serif" font-size="13" fill="#000000">259</text>

  <line x1="730" y1="430" x2="730" y2="140" stroke="#000000" stroke-width="2"/>
  <text x="742" y="145" font-family="Arial, sans-serif" font-size="14" fill="#000000">6000</text>
  <text x="742" y="220" font-family="Arial, sans-serif" font-size="14" fill="#000000">4500</text>
  <text x="742" y="295" font-family="Arial, sans-serif" font-size="14" fill="#000000">3000</text>
  <text x="742" y="370" font-family="Arial, sans-serif" font-size="14" fill="#000000">1500</text>
  <text x="742" y="435" font-family="Arial, sans-serif" font-size="14" fill="#000000">0</text>
  <text x="760" y="120" font-family="Arial, sans-serif" font-size="14" fill="#000000">Group count</text>

  <polyline points="165,430 335,377 505,158" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="165" cy="430" r="5" fill="#000000"/>
  <circle cx="335" cy="377" r="5" fill="#000000"/>
  <circle cx="505" cy="158" r="5" fill="#000000"/>
  <text x="155" y="448" font-family="Arial, sans-serif" font-size="13" fill="#000000">4</text>
  <text x="323" y="395" font-family="Arial, sans-serif" font-size="13" fill="#000000">1099</text>
  <text x="495" y="176" font-family="Arial, sans-serif" font-size="13" fill="#000000">5632</text>

  <rect x="610" y="250" width="300" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="630" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#000000">Talking points</text>
  <text x="630" y="310" font-family="Arial, sans-serif" font-size="14" fill="#000000">- Large case: 19.5x faster than medium</text>
  <text x="630" y="335" font-family="Arial, sans-serif" font-size="14" fill="#000000">  (5046 ms -> 259 ms)</text>
  <text x="630" y="360" font-family="Arial, sans-serif" font-size="14" fill="#000000">- Coverage remains 100% for all cases</text>
  <text x="630" y="385" font-family="Arial, sans-serif" font-size="14" fill="#000000">- Group count grows sharply at scale</text>
</svg>
