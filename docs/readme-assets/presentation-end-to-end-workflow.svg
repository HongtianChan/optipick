<svg xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1200" height="720" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="50" y="60" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#000000">
    End-to-End Workflow (Solve + Verify)
  </text>
  <text x="50" y="95" font-family="Arial, sans-serif" font-size="18" fill="#000000">
    Recommended replacement for the current API-only pipeline slide.
  </text>

  <rect x="70" y="170" width="200" height="90" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="110" y="225" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#000000">Web UI</text>

  <rect x="330" y="170" width="250" height="90" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="362" y="225" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#000000">Input Validation</text>

  <rect x="640" y="170" width="220" height="90" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="672" y="225" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#000000">api/solve</text>

  <rect x="920" y="170" width="220" height="90" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="952" y="225" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#000000">Solver Core</text>

  <line x1="270" y1="215" x2="330" y2="215" stroke="#000000" stroke-width="3"/>
  <polygon points="330,215 312,205 312,225" fill="#000000"/>
  <line x1="580" y1="215" x2="640" y2="215" stroke="#000000" stroke-width="3"/>
  <polygon points="640,215 622,205 622,225" fill="#000000"/>
  <line x1="860" y1="215" x2="920" y2="215" stroke="#000000" stroke-width="3"/>
  <polygon points="920,215 902,205 902,225" fill="#000000"/>

  <line x1="1030" y1="260" x2="1030" y2="330" stroke="#000000" stroke-width="3"/>
  <polygon points="1030,330 1020,312 1040,312" fill="#000000"/>

  <rect x="860" y="340" width="340" height="180" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="890" y="385" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#000000">
    Post Verification
  </text>
  <text x="890" y="420" font-family="Arial, sans-serif" font-size="19" fill="#000000">
    api/verify checks all required j-subsets
  </text>
  <text x="890" y="450" font-family="Arial, sans-serif" font-size="19" fill="#000000">
    valid=true only if strict coverage is met
  </text>
  <text x="890" y="480" font-family="Arial, sans-serif" font-size="19" fill="#000000">
    returns coverage ratio and missing subsets
  </text>

  <line x1="860" y1="430" x2="700" y2="430" stroke="#000000" stroke-width="3"/>
  <polygon points="700,430 718,420 718,440" fill="#000000"/>

  <rect x="420" y="340" width="250" height="180" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="452" y="385" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#000000">
    Final Response
  </text>
  <text x="452" y="420" font-family="Arial, sans-serif" font-size="19" fill="#000000">
    groups
  </text>
  <text x="452" y="450" font-family="Arial, sans-serif" font-size="19" fill="#000000">
    runtime_ms
  </text>
  <text x="452" y="480" font-family="Arial, sans-serif" font-size="19" fill="#000000">
    coverage = 100%
  </text>

  <line x1="420" y1="430" x2="250" y2="430" stroke="#000000" stroke-width="3"/>
  <polygon points="250,430 268,420 268,440" fill="#000000"/>

  <rect x="70" y="340" width="150" height="180" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="102" y="405" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#000000">
    Display
  </text>
  <text x="102" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#000000">
    in UI
  </text>
</svg>
