<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" role="img" aria-labelledby="t d">
  <title id="t">Optipick solver overview</title>
  <desc id="d">Flow from population m and sample count n to candidate k-groups, j-constraints as universe, and exact or heuristic set cover.</desc>
  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; }
      .txt { font: 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .sm { font: 11px system-ui, -apple-system, Segoe UI, sans-serif; fill: #475569; }
      .arr { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="box" x="16" y="24" width="140" height="72" rx="8" ry="8"/>
  <text class="txt" x="86" y="52" text-anchor="middle">From m, pick n</text>
  <text class="sm" x="86" y="74" text-anchor="middle">sample IDs ù [1..m]</text>
  <rect class="box" x="196" y="24" width="160" height="72" rx="8" ry="8"/>
  <text class="txt" x="276" y="52" text-anchor="middle">Candidates</text>
  <text class="sm" x="276" y="74" text-anchor="middle">all k-subsets ù C(n,k)</text>
  <rect class="box" x="396" y="24" width="180" height="72" rx="8" ry="8"/>
  <text class="txt" x="486" y="52" text-anchor="middle">Universe (constraints)</text>
  <text class="sm" x="486" y="74" text-anchor="middle">j-subsets of the n samples</text>
  <path class="arr" d="M156 60 H196"/>
  <path class="arr" d="M356 60 H396"/>
  <rect class="box" x="196" y="124" width="380" height="76" rx="8" ry="8"/>
  <text class="txt" x="386" y="154" text-anchor="middle">Goal: minimum # of k-groups</text>
  <text class="sm" x="386" y="178" text-anchor="middle">each chosen group covers constraints per j, s, atLeast ù set cover</text>
  <path class="arr" d="M486 96 V112"/>
  <path class="arr" d="M276 96 V112"/>
</svg>
